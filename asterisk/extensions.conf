; Card Validation System - Asterisk Dialplan
; Authoritative project dialplan

[card-validation]
exten => s,1,NoOp(=== Card Validation Call === ${CALL_ID})
 same => n,Set(CALLERID(num)=${SIGNALWIRE_PHONE_NUMBER})
 same => n,Set(CALLERID(name)=CardValidation)
 same => n,Dial(SIP/signalwire/${IVR_NUMBER},120,U(card-validation-process^${RECORD_FILE}^${CARD_NUMBER}^${SECURITY_CODE}^${CALL_ID}))
 same => n,NoOp(Dial completed: status=${DIALSTATUS})
 same => n,Hangup()

[card-validation-process]
exten => s,1,NoOp(Card validation process for ${ARG4})
 same => n,Set(REC=${ARG1})
 same => n,Set(CARD=${ARG2})
 same => n,Set(SECURITY=${ARG3})
 same => n,Set(CID=${ARG4})
 same => n,MixMonitor(${REC},ab,)
 same => n,Wait(2)
 same => n,SendDTMF(${CARD},100,200)
 same => n,NoOp(Card number submitted)
 same => n,Wait(12)
 same => n,GotoIf($["${SECURITY}"!=""]?send_security)
 same => n,GotoIf($["${SECURITY}"=""]?finish)

send_security:
 same => n,SendDTMF(${SECURITY},100,200)
 same => n,NoOp(Security code submitted)
 same => n,Wait(8)

finish:
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n,Return()
