; Card Validation System - Chan_SIP Configuration for SignalWire
; SignalWire SIP Trunk Configuration (Chan_SIP - more compatible)
;
; SECURITY NOTE: Replace the placeholders below with your real SignalWire
; credentials. Never commit real secrets. The values here are NOT real.
; Load this file into /etc/asterisk/sip.conf or include it from sip.conf.

[general]
register => SIGNALWIRE_USERNAME:SIGNALWIRE_SIP_SECRET@YOURSPACE.sip.signalwire.com/SIGNALWIRE_USERNAME

[signalwire]
host=YOURSPACE.sip.signalwire.com
username=SIGNALWIRE_USERNAME
secret=SIGNALWIRE_SIP_SECRET
context=from-signalwire
fromuser=SIGNALWIRE_USERNAME
fromdomain=YOURSPACE.sip.signalwire.com
insecure=port,invite
qualify=yes
nat=force_rport,comedia
canreinvite=no
directmedia=no
dtmfmode=rfc2833
sendrpid=yes
trustrpid=yes
sendpai=yes
inbandprogress=yes
disallow=all
allow=ulaw,alaw

[from-signalwire]
exten => _.,1,NoOp(Incoming call from SignalWire)
 same => n,Hangup()
