; Card Validation System - PJSIP Configuration for Twilio
; Twilio SIP Trunk Configuration

[transport-twilio]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
external_media_address=YOUR_SERVER_PUBLIC_IP
external_signaling_address=YOUR_SERVER_PUBLIC_IP

[twilio]
type=registration
outbound_auth=twilio_auth
server_uri=sip:trunk.twilio.com:5060
client_uri=sip:TWILIO_ACCOUNT_SID@sip.twilio.com:5060
retry_interval=60
forbidden_retry_interval=300
expiration=120
contact_user=TWILIO_ACCOUNT_SID

[twilio]
type=auth
auth_type=userpass
username=TWILIO_ACCOUNT_SID
password=TWILIO_AUTH_TOKEN
realm=sip.twilio.com

[twilio]
type=endpoint
aors=twilio
auth=twilio_auth
context=from-twilio
disallow=all
allow=ulaw,alaw
direct_media=no
trust_id_inbound=yes
trust_id_outbound=yes
send_pai=yes
inband_progress=yes

[twilio]
type=aor
contact=sip:trunk.twilio.com:5060
max_contacts=1

[from-twilio]
exten => _.,1,NoOp(Incoming call from Twilio)
 same => n,Hangup()
