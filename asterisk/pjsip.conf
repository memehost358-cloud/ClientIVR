; Card Validation System - PJSIP Configuration for SignalWire
; SignalWire SIP Trunk Configuration

[transport-signalwire]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
external_media_address=10.0.0.157
external_signaling_address=10.0.0.157

[signalwire]
type=registration
outbound_auth=signalwire_auth
server_uri=sip:universal.sip.signalwire.com:5060
client_uri=sip:SIGNALWIRE_ACCOUNT_SID@universal.sip.signalwire.com:5060
retry_interval=60
forbidden_retry_interval=300
expiration=120
contact_user=SIGNALWIRE_ACCOUNT_SID

[signalwire]
type=auth
auth_type=userpass
username=SIGNALWIRE_ACCOUNT_SID
password=SIGNALWIRE_AUTH_TOKEN
realm=signalwire.com

[signalwire]
type=endpoint
aors=signalwire
auth=signalwire_auth
context=from-signalwire
disallow=all
allow=ulaw,alaw
direct_media=no
trust_id_inbound=yes
trust_id_outbound=yes
send_pai=yes
inband_progress=yes

[signalwire]
type=aor
contact=sip:universal.sip.signalwire.com:5060
max_contacts=1

[from-signalwire]
exten => _.,1,NoOp(Incoming call from SignalWire)
 same => n,Hangup()
